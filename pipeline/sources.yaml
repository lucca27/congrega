# ============================================================================
# REGISTRO DE FONTES — a espinha dorsal da cobertura nacional.
# "Cobertura total" = manter esta lista completa. Cada sociedade nacional tem
# uma agenda oficial; os agregadores pegam o que escapa; as APIs cobrem quem
# usa Even3/Sympla. O crawler descobre a página de agenda a partir do site.
#
# tier:  1 sociedade nacional · 2 regional/estadual · 3 agregador · 4 API
# cadence: com que frequência recoletar (o scheduler usa isto)
# ativo:  entra na coleta agora
# ============================================================================

sources:
  # ---------- TIER 3 · agregadores (arranque rápido, cobrem tudo raso) -------
  - {nome: AgrupaMED, tier: 3, tipo: html, cadence: semanal, ativo: true,
     url: "https://agrupamed.com.br/congressos"}
  - {nome: bip,       tier: 3, tipo: html, cadence: semanal, ativo: true,
     url: "https://www.usebip.com/blogs/bip-insights/calendario-de-congressos-medicos-2026"}
